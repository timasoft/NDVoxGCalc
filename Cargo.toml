[workspace]
members = [".", "expr"]
resolver = "2"

[package]
name = "hypervox"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
debug = false
overflow-checks = false

[profile.release.package.hypervox_expr]
opt-level = 3
codegen-units = 1

[dependencies]
hypervox_expr = { path = "expr" }
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
] }
bevy_egui = "0.41"
bevy_panorbit_camera = "0.35.0"
rand = "0.10.1"
rayon = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
    "x11",
    "wayland",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_pbr",
    "bevy_gizmos_render",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
    "bevy_winit",
    "webgl2",
] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
wasm-bindgen = "=0.2.117"
js-sys = "=0.3.94"
web-sys = "=0.3.94"
wasm-bindgen-futures = "=0.4.67"
web-time = "1.1.0"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
